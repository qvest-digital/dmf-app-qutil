apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - httproute.yaml
  - ghcr-pull-secret.yaml
  - mediamtx-deployment.yaml
  - mediamtx-service.yaml
  - mediamtx-webrtc-udp.yaml
  - writer-deployment.yaml
  - composite-deployment.yaml
  - composite-service.yaml
  - metrics-aggregator.yaml
  - txdarwin-output-viewer.yaml
  - test-sources.yaml

# Hash-suffixed configmaps: any change to a file under config/ produces
# a new ConfigMap name, kustomize rewrites the volume reference in the
# mediamtx Deployment, and the resulting spec diff triggers a rolling
# restart. This is the GitOps-friendly way to ensure mediamtx + caddy
# pick up new paths / Caddyfile on a `kubectl apply` without an
# out-of-band `rollout restart`. Survives cluster recreate.
#
# The frontend is not here: it is an Angular app (ui/) baked into the
# caddy sidecar's image, because a bundle is a tree of hashed files
# rather than a single document a ConfigMap could carry.
configMapGenerator:
  - name: mediamtx-config
    options:
      labels:
        app: mediamtx
    files:
      - mediamtx.yml=config/mediamtx.yml
  - name: multiviewer
    options:
      labels:
        app: mediamtx
    files:
      - Caddyfile=config/Caddyfile
  # Python source for the demo-metrics aggregator (mounted at /app).
  - name: demo-metrics-script
    files:
      - aggregator.py=metrics/aggregator.py
