#
# Applied separately from ../kustomization.yaml, and it has to stay that way:
# the demo app's Flux Kustomization carries targetNamespace: demo-app, which
# would move the claims out of the namespace the production owns. Point a
# second Flux Kustomization at this path with no targetNamespace.
#
# MediaProduction sits here rather than under bookings/ because it is
# cluster-scoped: kustomize cannot know that for a CRD and would stamp the
# namespace transformer onto it.
#
# bookings/ is deliberately absent: it is a Flux Kustomization of its own,
# gated on this one. Everything under it lives in the namespace the lifecycle
# plane creates while reconciling the MediaProduction, so the two cannot share
# an apply. kustomize-controller sorts a set by kind and puts kinds it has no
# ordering for last, so the RoleBinding is validated against a namespace that
# only the MediaProduction behind it brings into being. The apply aborts
# there, nothing in the set lands, and every retry reaches the same point.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mediaproduction.yaml
