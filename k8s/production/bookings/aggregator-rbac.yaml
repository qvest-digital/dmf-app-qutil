#
# The demo-metrics aggregator's kill endpoint deletes a writer pod to show the
# flow recovering. Its ClusterRole reads pods anywhere, but delete is granted
# only where the writers actually run, and they run here rather than beside it
# now that they are booked from the catalog. The subject stays the
# ServiceAccount in the demo namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-metrics-writer-kill
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-metrics-writer-kill
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-metrics-writer-kill
subjects:
  - kind: ServiceAccount
    name: demo-metrics
    namespace: demo-app
