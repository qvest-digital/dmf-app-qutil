#
# Everything booked into the namespace the MediaProduction owns. The operator
# creates that namespace while reconciling the production, so this path needs
# a Flux Kustomization of its own that depends on the one applying ../ and
# waits for the production to report Ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production-demo-app
resources:
  - writer-claims.yaml
  - aggregator-rbac.yaml
