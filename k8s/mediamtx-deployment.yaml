apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  labels:
    app: mediamtx
    mxl.qvest-digital.com/role: consumer
spec:
  replicas: 1
  # Recreate: a rolling update would briefly run two pods against the same
  # hostPath MXL domain and the same published paths.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
        # mediamtx-mxl reads MXL flows directly via libmxl
        # (mxl:///run/mxl/domain/... static source), so it's a consumer
        # too — sharing the same mirrors the compositor uses on the
        # same node.
        mxl.qvest-digital.com/role: consumer
    spec:
      # mediamtx is otherwise unpinned: the gateway mirrors each authorized
      # flow into the node-local domain of every node that runs a selected
      # consumer pod, mediamtx and compositor alike. Cross-node bridging is
      # the mxl-k8s gateway's job, not these pods'.
      #
      # But it must NOT land on an LB-excluded node (the control planes on
      # both clusters, which are schedulable): mediamtx-webrtc-udp uses
      # externalTrafficPolicy: Local, so only the node hosting this pod
      # passes the LB health check — and excluded nodes are never registered
      # as targets at all. mediamtx on a control plane = every NLB target
      # unhealthy = all WebRTC/ICE traffic blackholed (tiles fall back to
      # HLS). On dev this was a nightly-rebuild dice roll.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/exclude-from-external-load-balancers
                    operator: DoesNotExist
      tolerations:
        - key: "vpc.amazonaws.com/efa"
          operator: "Exists"
          effect: "NoSchedule"
      # mediamtx-mxl is published as a private GHCR package. PAT lives
      # in AWS SM; ESO renders demo-app-ghcr-pull (see ghcr-pull-secret.yaml).
      imagePullSecrets:
        - name: demo-app-ghcr-pull
      initContainers:
        # Same shim as the compositor — mediamtx-mxl and the audio preview
        # both call mxlCreateFlowReader and would race the agent's mirror
        # materialization without it.
        - name: install-intent-shim
          # renovate: datasource=docker depName=ghcr.io/qvest-digital/mxl-k8s/shim
          image: ghcr.io/qvest-digital/mxl-k8s/shim:v1.0.0-rc.14
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: intent-shim
              mountPath: /shared
      containers:
        - name: mediamtx
          # Upstream image built + pushed by qvest-digital/mediamtx CI on
          # the feature/mxl-static-source branch (workflow: mxl-image.yml).
          # renovate: datasource=docker depName=ghcr.io/qvest-digital/mediamtx-mxl versioning=docker
          image: ghcr.io/qvest-digital/mediamtx-mxl:ecbae6487474ff7c5fab8970289a07403f78efdd
          imagePullPolicy: Always
          env:
            - name: LD_PRELOAD
              value: /opt/mxl-intent/libmxl-intent.so
          ports:
            - containerPort: 8888
              name: hls
            - containerPort: 8889
              name: webrtc
          securityContext:
            capabilities:
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
            # Mount /run/mxl as a whole rather than the domain subdir and
            # agent.sock separately: a single-file hostPath mount pins
            # the socket's inode at container start, and the mxl-k8s
            # agent unlinks and recreates agent.sock on every restart,
            # stranding any consumer pod already running at that point
            # on the dead inode until the pod itself restarts.
            - name: mxl-run
              mountPath: /run/mxl
              readOnly: false
            - name: intent-shim
              mountPath: /opt/mxl-intent
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            # One ffmpeg libx264 subprocess per active MXL path. With
            # 8 MXL tiles (+1 SRT loop) all live at once, worst case is
            # 9 concurrent encoders. Idle mediamtx ~125 Mi; each ffmpeg
            # child ~400-600 Mi at 1080p with the ultrafast preset.
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "10"
              memory: 8Gi

        # Audible previews for MXL AUDIO flows: the feature mediamtx is
        # missing. Its mxlSource rejects any flow whose format is not video
        # ("flow <id> is not video (format=audio)") and retries the open every
        # 5s forever, so there is no mxl:// path from an audio/float32 flow to
        # a browser. This container reads the flow's per-channel ring buffers
        # via libmxl, interleaves them to F32LE, encodes Opus for WHEP and AAC
        # for HLS, and publishes both over RTSP into paths the aggregator
        # created in publisher mode.
        #
        # It rides in this pod rather than one of its own because everything it
        # needs is already here. The RTSP hop it publishes over is now
        # loopback, and the flow it reads has to be mirrored to exactly the
        # node that already has to hold every previewable flow for the video
        # side. As a Deployment it carried a hard podAffinity onto the
        # compositor's node instead, which no autoscaler can satisfy: a term
        # against a running pod is only satisfiable on the node already running
        # it, so a full compositor node left the preview Pending with no new
        # node able to help.
        #
        # On demand, not always-on: the multiviewer's Operator-flows list can
        # hold any number of audio flows and its preview overlay opens one at a
        # time, so a pod per flow would not scale. demo-metrics POSTs
        # /start?flow=<uuid> when an overlay opens and DELETEs /stop?flow=<uuid>
        # on close; this one container serves up to MXL_MAX_SESSIONS at once.
        #
        # No readinessProbe on purpose. Pod readiness is the AND of its
        # containers, and gating the multiviewer's HLS and WebRTC on the audio
        # preview would let a stuck preview blank every video tile. The
        # liveness probe restarts this container alone.
        - name: audio-preview
          image: ghcr.io/qvest-digital/mxl-dmf-demo-app/compositor-mxlk8s:latest
          imagePullPolicy: Always
          # Second entry point in the compositor image — same libmxl and
          # GStreamer link line, sample API instead of the grain API.
          command: ["/usr/bin/mxl-audio-preview"]
          ports:
            - containerPort: 8090
              name: control
          env:
            # The runtime root is what gets mounted; the domain below it is
            # this process's configuration, the same split the catalog's media
            # functions use.
            - name: MXL_DOMAIN
              value: /run/mxl/domain
            # Loopback: mediamtx's rtspAddress is :8554 and it is in this pod.
            - name: MXL_PREVIEW_RTSP_BASE
              value: rtsp://127.0.0.1:8554/preview-audio-
            - name: MXL_CONTROL_PORT
              value: "8090"
            - name: MXL_MAX_SESSIONS
              value: "4"
            - name: LD_PRELOAD
              value: /opt/mxl-intent/libmxl-intent.so
          securityContext:
            capabilities:
              # libmxl mlocks the tmpfs grain pages on the reader side too.
              add: ["IPC_LOCK", "SYS_RESOURCE"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 10
          volumeMounts:
            - name: mxl-run
              mountPath: /run/mxl
              readOnly: false
            - name: intent-shim
              mountPath: /opt/mxl-intent
              readOnly: true
          resources:
            # Opus at 128kbit on a couple of channels is trivial next to the
            # composite's x264 pass.
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

        # Caddy sidecar: serves the Angular multiviewer at /, reverse-proxies
        # HLS at /hls/* to mediamtx on localhost, and rewrites mediamtx's
        # cookieCheck 302 Location headers so the browser stays on the
        # public origin.
        #
        # The image is caddy:2-alpine with the app's build output baked into
        # /srv (ui/Dockerfile), which is why there is no longer a caddy-www
        # ConfigMap volume — an Angular bundle is a tree of hashed files, not
        # one index.html. The Caddyfile stays a ConfigMap so the routes above
        # remain editable through GitOps without rebuilding the image.
        - name: caddy
          image: ghcr.io/qvest-digital/mxl-dmf-demo-app/ui:latest
          args: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: caddy-conf
              mountPath: /etc/caddy
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: config
          configMap:
            name: mediamtx-config
        # The MXL runtime root, shared with the mxl-k8s agent + gateway
        # DaemonSets via hostPath: the domain the agent materializes mirrors
        # into, and the agent.sock the shim reports intent over. Both readers
        # in this pod get the root and resolve the domain below it themselves.
        # Mounting the root rather than domain/ and agent.sock separately
        # matters: a single-file hostPath mount pins the socket's inode at
        # container start, and the agent unlinks and recreates agent.sock on
        # every restart, stranding a running consumer on the dead inode.
        - name: mxl-run
          hostPath:
            path: /run/mxl
            type: DirectoryOrCreate
        - name: intent-shim
          emptyDir: {}
        - name: caddy-conf
          configMap:
            name: multiviewer
            items:
              - key: Caddyfile
                path: Caddyfile
