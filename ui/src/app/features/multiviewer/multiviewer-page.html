<main [class.previewing]="previews().length > 0">
  <aside class="panel">
    <h2>RDMA delivery</h2>
    <div class="agg">
      <div class="stat">
        <div class="k">Throughput</div>
        <div class="v lime">{{ totals()?.mbps | fmt }} <small>Mbit/s</small></div>
      </div>
      <div class="stat">
        <div class="k">Grains / s</div>
        <div class="v">{{ totals()?.fps | fmt }}</div>
      </div>
      <div class="stat">
        <div class="k">Flows live</div>
        <div class="v">
          {{ totals()?.live ?? '-' }}<small>/{{ totals()?.total ?? '-' }}</small>
        </div>
      </div>
    </div>

    <div class="gwbar">
      <h2>Gateways</h2>
      <mv-gateway-grid [gateways]="gateways()" />
    </div>

    <mv-operator-flow-list [flows]="opFlows()" />
  </aside>

  <!-- Only rendered while something is open, so the panel has the width to itself
       otherwise. Each card is keyed by flow id: the column must not rebuild a
       card, or its player and its mediamtx path would go with it. -->
  @if (previews().length) {
    <aside class="previews">
      @for (preview of previews(); track preview.id) {
        <mv-flow-preview [request]="preview" />
      }
    </aside>
  }
</main>
