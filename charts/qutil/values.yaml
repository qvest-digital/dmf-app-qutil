nameOverride: ""
fullnameOverride: ""

# The namespace a MediaProduction owns, which this release books into. No
# default: the release writes claims into a namespace it does not own, so a
# wrong guess would book against the wrong production. The chart fails to
# render without it.
#
# One production takes one qutil release. Installing this chart twice against
# the same production creates a second set of claims under the same names.
production:
  namespace: ""

# Serves the multiviewer bundle and reverse-proxies the aggregator, the
# compositor stats and the media server. Caddy is the whole container: the
# media server is a booked media function now, not a sidecar.
ui:
  replicaCount: 1
  image:
    repository: ghcr.io/qvest-digital/dmf-app-qutil/ui
    # Empty resolves to the chart's appVersion, which the publish workflow
    # stamps with the release version. Pin only to run an off-release image.
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Merges writer pod state, MXL control-plane CRs and the media server's path
# API into what the multiviewer polls. Also creates and deletes preview paths on
# demand, which is why it needs the media server's API endpoint, and -- where
# generators below are enabled -- the writer claims the UI books.
aggregator:
  replicaCount: 1
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  service:
    port: 8088
  # Namespace holding the mxl-k8s gateway pods, read for the gateway panel.
  gatewayNamespace: mxl-system
  # The four video flows the multiviewer tiles. Fixed by design: the tile grid
  # is a fixed four, and only the way they are served became dynamic.
  flowPrefix: d4d00000-0000-0000-0000-00000000000
  flowCount: 4
  # Namespace the per-booking txDarwin instances are deployed into.
  bookingNamespace: txdarwin
  # Reader for ANC data flows, as a plain address: previewing SMPTE 291 means
  # decoding grains, which needs libmxl and the node's MXL domain, so it is a
  # media function's job rather than the aggregator's. No catalog class publishes
  # one yet, so this is empty and a data preview says the reader is not booked.
  ancPreviewApi: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# Booked media functions. Each is a MediaFunctionClaim rendered into
# production.namespace. A claim names a class and carries only what makes this
# booking different; the class supplies everything cluster-shaped.
mediamtx:
  enabled: true
  claimName: mediamtx
  className: mediamtx
  # The only static path a booking declares. Publisher mode, no flowId: the
  # compositor pushes its mosaic into it. Per-flow preview paths are created
  # over the HTTP API at runtime and deliberately absent here -- a path change
  # through the claim would roll the pod, and claim parameters are consumed at
  # provision time only.
  paths:
    composite: {}
  parameters: {}

compositor:
  enabled: true
  claimName: compositor
  className: compositor
  # Tile geometry has to match what the writers produce and what the
  # multiviewer expects.
  frameWidth: 1296
  frameHeight: 720
  parameters: {}

# One claim per flow: a writer pod writes one flow, so four tiles are four
# claims. Geometry is stated per claim rather than inherited from the class.
writers:
  enabled: true
  className: mxl-writer
  frameWidth: 1296
  frameHeight: 720
  grainRate:
    numerator: 30000
    denominator: 1001
  # Per pattern, because the spread is wide: an animated pattern regenerates
  # every frame where a static one repeats it. The class ships one envelope for
  # all of them, sized for 1080p50, which reserves several times what any of
  # these needs at this geometry and makes a cluster look full while it idles.
  #
  # Figures are measured at this geometry on both an AWS and a bare-metal
  # cluster, taken as the lifetime average of the pod's cgroup over hours. The
  # class README's 720p30 numbers are scaled rather than measured and read 3 to
  # 5 times low, so they are not the basis here.
  #
  # Requests carry the higher of the two clusters plus room, since the same
  # pattern costs about twice as much on the AWS CPUs. Limits stay well clear of
  # the peak: none of these has ever been throttled and none should start.
  video:
    - name: writer-mxl-1
      groupHint: mxl-multiviewer-1
      flowId: d4d00000-0000-0000-0000-000000000001
      pattern: smpte
      overlayText: MXL-1
      # 531m bare metal, 479m AWS.
      resources:
        requests:
          cpu: 700m
          memory: 256Mi
        limits:
          cpu: "1500m"
          memory: 512Mi
    - name: writer-mxl-2
      groupHint: mxl-multiviewer-2
      flowId: d4d00000-0000-0000-0000-000000000002
      pattern: ball
      overlayText: MXL-2
      # The animated one, and the only writer that needs more than a core:
      # 611m bare metal, 1132m AWS. The bare-metal figure is the cost of the
      # ~25 grains/s it currently reaches, not of a full 30.
      resources:
        requests:
          cpu: 1400m
          memory: 256Mi
        limits:
          cpu: "2500m"
          memory: 512Mi
    - name: writer-mxl-3
      groupHint: mxl-multiviewer-3
      flowId: d4d00000-0000-0000-0000-000000000003
      pattern: gamut
      overlayText: MXL-3
      # 174m bare metal, 46m AWS.
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "800m"
          memory: 512Mi
    - name: writer-mxl-4
      groupHint: mxl-multiviewer-4
      flowId: d4d00000-0000-0000-0000-000000000004
      pattern: checkers-8
      overlayText: MXL-4
      # 188m bare metal, 96m AWS.
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "800m"
          memory: 512Mi
  audio:
    enabled: true
    name: audio-testsrc
    groupHint: mxl-audio-testsrc
    flowId: a0d10000-0000-0000-0000-000000000001
    sampleRate: 48000
    channelCount: 2
    wave: sine
    # A fifth apart, so the two channels stay tellable apart on a meter.
    frequencies: [440, 660]
    volume: 0.5
    # About a core on both clusters, 1026m and 977m, which is more than any
    # video writer here except the animated one. Sized to what it uses rather
    # than to what generating a sine ought to cost.
    resources:
      requests:
        cpu: 1200m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 256Mi

# Booking writers from the UI: the operator picks a videotestsrc pattern, the
# aggregator creates a MediaFunctionClaim of writers.className, and the page
# lists and deletes what it booked. The four writers above stay where they are;
# this is for the flows a demo wants without a release.
#
# Off by default, and deliberately: enabling it grants the aggregator create and
# delete on claims in the production namespace, and nothing in front of this API
# authenticates. An install whose hostname is reachable by people who should not
# be able to book a workload leaves this alone.
generators:
  enabled: false
  # Empty follows writers.className, so a cluster that registers the class under
  # another name says so once.
  className: ""
  jobRef: qutil/generators
  # Every claim the page books starts with this, and it refuses to delete one
  # that does not. The claims this chart renders cannot match it.
  namePrefix: generator-
  # A ceiling on what one form can allocate: each generator is a writer pod with
  # a grain ring in the node's MXL domain, which is RAM.
  maxCount: 8
  # Stamped onto every page-booked claim. These are the measured smpte figures
  # from writers.video above; an animated pattern costs more, which is why the
  # page caps an animated pattern's frame size rather than granting it more.
  resources:
    requests:
      cpu: 700m
      memory: 256Mi
    limits:
      cpu: "1500m"
      memory: 512Mi

booking:
  jobRef: mediaops/demo-app
  # These claims are applied by this release, not raised per job, so their
  # parameters change whenever the release is upgraded and their classes change
  # whenever the catalog is. Without this the booked functions keep running what
  # they were first provisioned with until something deletes the claims.
  #
  # It costs a workload restart when an input moves, which is the trade a claim
  # raised per job would not want and this one does.
  reprovisionOnDrift: true

# Gateway API route. The hostname is per-cluster and has no sensible default.
ingress:
  enabled: true
  hostname: ""
  parentRef:
    name: istio-ingressgateway
    namespace: istio-system
    sectionName: https

# ESO renders a dockerconfigjson Secret from a GHCR PAT so kubelet can pull
# the private UI image.
imagePullSecret:
  enabled: true
  name: demo-app-ghcr-pull
  secretStore:
    create: true
    name: aws-secretsmanager
    region: eu-central-1
  remoteRef:
    key: mxl/dev/demo-app/ghcr-pat
    usernameProperty: username
    passwordProperty: pat
  refreshInterval: 1h

# The SRT sources feeding the production. One claim per source: the ingest
# decodes one stream into one set of flows, so three sources are three claims
# rather than one claim scaled to three.
#
# The port and the flow ids are per booking by necessity. The pod runs
# hostNetwork, so the port is a host port and two claims on one node must not
# share it; two claims sharing a flow id write over each other's grains.
srtIngest:
  enabled: true
  className: srt-mxl-ingest
  # Gates the public endpoint: only a sender passing the matching value
  # connects. The generators below read the same Secret to dial the ingests.
  # Disable where the cluster syncs this Secret itself, as it does for the pull
  # secret.
  passphrase:
    enabled: true
    secretName: srt-ingest-passphrase
    key: SRT_PASSPHRASE
    # Cluster-scoped on purpose: one definition then serves both the release
    # namespace and the production namespace, and it is the store the clusters
    # already provide.
    secretStore:
      kind: ClusterSecretStore
      name: aws-secretsmanager
    remoteRef:
      key: mxl/dev/srt-ingest/passphrase
      property: passphrase
    refreshInterval: 1h
  # Source 1 is the one a camera normally feeds; the in-cluster generators
  # below cover 2 and 3. The ports differ because they are host ports.
  sources:
    - name: srt-ingest-1
      groupHint: srt-ingest-1
      port: 9000
      videoFlowId: b2000000-0000-0000-0000-000000000001
      audioFlowId: aea7b9e9-1e5b-4333-9ac4-8689053a77de
      ancFlowId: c3000000-0000-0000-0000-000000000001
    - name: srt-ingest-2
      groupHint: srt-ingest-2
      port: 9001
      videoFlowId: b2000000-0000-0000-0000-000000000002
      audioFlowId: 2fffed31-8d6f-4558-b368-4a925d364fd3
      ancFlowId: c3000000-0000-0000-0000-000000000002
    - name: srt-ingest-3
      groupHint: srt-ingest-3
      port: 9002
      videoFlowId: b2000000-0000-0000-0000-000000000003
      audioFlowId: b906f97d-5c90-4db2-976a-cd8a3a655925
      ancFlowId: c3000000-0000-0000-0000-000000000003

# Cluster-internal SRT generators standing in for playout sources. Each dials
# one booked ingest by its claim name in the production namespace, so they are
# only useful where those claims are bound.
testSources:
  enabled: true
  image: linuxserver/ffmpeg@sha256:e6b338a3a9d7ca2a33d345fa683d68767f799f2c13694542ba5bfb4f63dff585
  sources:
    - name: srt-test-source-2
      claim: srt-ingest-2
      port: 9001
      label: ZUSPIELER 2
      # An animated fractal, and it has to stay animated: this tile exists to
      # show a live picture, so a still frame is indistinguishable from a dead
      # feed.
      #
      # mandelbrot cannot do that job here. Its cost is unbounded -- it zooms
      # from scale 3 to 0.3 with up to 7189 iterations per pixel, and lavfi
      # source filters are single-threaded, so measured on sc it holds 30fps
      # for about three minutes of content and then decays to 0.47x and
      # falling, pinned at one core with five more idle. Bounding it trades one
      # failure for another: capping maxiter alone still decays, because the
      # driver is zoom depth, and stopping the zoom holds 1.00x but freezes the
      # picture once end_pts passes. Morphing in place instead of zooming never
      # reaches realtime at all (0.54x), and the filter has no loop or
      # oscillate option to escape between those.
      #
      # sierpinski animates indefinitely at a constant cost. Measured on sc:
      # a steady 1.82 cores for the full paced pipeline, freezedetect clean
      # over 300s of content, and the ingest at late=0 dup=0 resync=0.
      pattern: "sierpinski=size=1296x720:rate=30"
      # This source regenerates every pixel of every frame, where smptebars
      # repeats a static one, so it costs several times the default envelope
      # and states its own.
      #
      # Measured on sc for the whole paced pipeline -- generation, both drawtext
      # overlays, x264 veryfast and the AES-encrypted SRT send: a steady 1.82
      # cores, flat over three and a half minutes. Measuring the encode alone
      # to /dev/null reads 1.14 and would size this at close to half what it
      # needs; the SRT and encryption path is the rest.
      #
      # The limit clears that peak by a wide margin because CFS accounts per
      # 100ms period and x264 bursts inside one even while the ten-second
      # average sits under the limit: measured throttling was 6.5% of periods
      # at a limit of 1, still 4.6% at 3, and effectively none at 4.
      resources:
        requests:
          cpu: "2"
          memory: 256Mi
        limits:
          cpu: "4"
          memory: 512Mi
    - name: srt-test-source-3
      claim: srt-ingest-3
      port: 9002
      label: ZUSPIELER 3
      pattern: "smptebars=size=1296x720:rate=30"
  # Envelope for a source that does not state its own. Sized for a static
  # pattern: smptebars measured 0.61 cores for the full paced pipeline on sc.
  #
  # A new source needs a pattern whose cost is bounded. lavfi generators are
  # single-threaded, so one core is the ceiling no matter what is granted
  # here, and a pattern that grows more expensive over time cannot be sized
  # for at all -- it just starves its SRT sender later instead of sooner.
  # A generator that cannot hold realtime starves its SRT sender, and the
  # symptoms then surface on the ingest as negative minLead and growing
  # late/dup, which reads as a cluster fault rather than a throttled encoder.
  resources:
    requests:
      cpu: 750m
      memory: 256Mi
    limits:
      cpu: "1500m"
      memory: 512Mi
