{{- if and .Values.srtIngest.enabled .Values.srtIngest.passphrase.enabled }}
{{- /* The SRT passphrase gates the public ingest endpoint: only a sender that
       passes the matching value connects. It is never in Git -- ESO renders it
       from the remote store into the Secret the claims name.

       Rendered into two namespaces because it has two consumers that do not
       share one: the ingest pods run in the namespace the MediaProduction
       owns, and the generators run in this release's namespace and read the
       same value to dial them.

       No SecretStore is created. The default reference is the cluster-scoped
       store both clusters already provide, which is what makes one definition
       serve both namespaces.

       Set passphrase.enabled to false where the cluster syncs this Secret
       itself, as it already does for the pull secret. */ -}}
{{- $root := . }}
{{- range list $.Release.Namespace (include "qutil.productionNamespace" $) | uniq }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $root.Values.srtIngest.passphrase.secretName }}
  namespace: {{ . }}
  labels:
    {{- include "qutil.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.srtIngest.passphrase.refreshInterval }}
  secretStoreRef:
    kind: {{ $root.Values.srtIngest.passphrase.secretStore.kind }}
    name: {{ $root.Values.srtIngest.passphrase.secretStore.name }}
  target:
    name: {{ $root.Values.srtIngest.passphrase.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $root.Values.srtIngest.passphrase.key }}
      remoteRef:
        key: {{ $root.Values.srtIngest.passphrase.remoteRef.key }}
        property: {{ $root.Values.srtIngest.passphrase.remoteRef.property }}
{{- end }}
{{- end }}
