{{- if .Values.testSources.enabled }}
{{- /* Cluster-internal SRT generators standing in for playout sources. Each
       dials one booked ingest by its claim name in the production namespace,
       so they are only useful where those claims are bound.

       They run on the host network because the ingest does. A pod on the CNI
       network cannot complete an SRT handshake with a hostNetwork listener on
       its OWN node: flannel masquerades in POSTROUTING, which a packet
       addressed to the local node never traverses, so it keeps its pod source
       address; the listener's socket is bound to 0.0.0.0 and replies via a
       route lookup that leaves by the CNI bridge, so the answer reaches the
       caller from an address it never sent to and SRT discards it. Whether a
       generator worked came down to whether the scheduler had placed it on the
       same node as its ingest.

       dnsPolicy is required with hostNetwork: the default resolves through the
       node's resolv.conf, where the claim's Service name does not exist.

       Shell variables are written without braces. The passphrase Secret is
       rendered by ESO and may appear after this app, so the volume is optional
       and the script waits for the key rather than the pod failing to start on
       a missing mount. */ -}}
{{- $root := . }}
{{- range .Values.testSources.sources }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    {{- include "qutil.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ .name }}
spec:
  replicas: 1
  # The component carries the source name because there is more than one of
  # them: a shared component value would make each Deployment select the
  # other's pods. The name label stays chart-wide, as qutil.labels sets it.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "qutil.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "qutil.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ .name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: ffmpeg
          image: {{ $root.Values.testSources.image }}
          env:
            - name: TARGET
              value: {{ printf "%s.%s:%v" .claim (include "qutil.productionNamespace" $root) .port | quote }}
            - name: LABEL
              value: {{ .label | quote }}
            - name: PATTERN
              value: {{ .pattern | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
              until [ -s /secrets/SRT_PASSPHRASE ]; do
                echo "warte auf {{ $root.Values.srtIngest.passphrase.secretName }} (kommt mit srt-ingest)"
                sleep 10
              done
              SRT_PASSPHRASE=$(cat /secrets/SRT_PASSPHRASE)
              while true; do
                ffmpeg -hide_banner -loglevel warning -re \
                  -f lavfi -i "$PATTERN" \
                  -vf "drawtext=fontfile=$FONT:text='$LABEL':fontcolor=white:fontsize=64:box=1:boxcolor=black@0.6:boxborderw=16:x=(w-text_w)/2:y=60,drawtext=fontfile=$FONT:text='%{localtime\:%T}':fontcolor=white:fontsize=48:box=1:boxcolor=black@0.6:boxborderw=12:x=(w-text_w)/2:y=h-130" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p \
                  -b:v 3000k -g 30 \
                  -mode caller -pbkeylen 16 -passphrase "$SRT_PASSPHRASE" \
                  -f mpegts "srt://$TARGET" || true
                echo "feed to $TARGET ended, reconnecting in 5s"
                sleep 5
              done
          resources:
            {{- toYaml (.resources | default $root.Values.testSources.resources) | nindent 12 }}
          volumeMounts:
            - name: bridge-secret
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: bridge-secret
          secret:
            secretName: {{ $root.Values.srtIngest.passphrase.secretName }}
            optional: true
{{- end }}
{{- end }}
