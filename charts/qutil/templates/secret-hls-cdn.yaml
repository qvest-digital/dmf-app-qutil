{{- if and .Values.mediamtx.enabled .Values.mediamtx.cdn.enabled }}
{{- /* The token that tells the media server a request arrived through this
       release's proxy.

       Without it the media server hands each HLS client a session: a 302 that
       sets a cookie, then a second cookie carrying the session id, and a 401
       on every playlist and segment that does not carry it back. The session
       lives in one process's memory and is pinned to the client IP, which
       behind a proxy is the proxy's own, so it survives neither a second
       replica nor a browser that declines the cookie -- and the cookies are
       Secure, SameSite=None and Partitioned, with no Path.

       Presenting this token instead makes the server treat the request the
       way it treats a CDN: no session, no cookie, no 401, and any replica can
       answer. That is upstream's mechanism for a trusted cache in front, and
       a reverse proxy inside the cluster is the same thing.

       It skips authentication, so it is a credential and not a marker. It is
       generated rather than taken from the secret store because both ends of
       it are in this release: nothing outside the cluster ever presents it,
       and nobody has to be able to read it. lookup keeps the value across an
       upgrade -- regenerating it would leave the proxy and the media server
       disagreeing until the booking's pod restarted.

       Rendered into two namespaces for the same reason the SRT passphrase is:
       the proxy runs here and the media server runs in the namespace the
       MediaProduction owns. */ -}}
{{- $root := . }}
{{- $name := .Values.mediamtx.cdn.secretName }}
{{- $ns := include "qutil.productionNamespace" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $token := "" }}
{{- if and $existing $existing.data (index $existing.data $root.Values.mediamtx.cdn.key) }}
{{- $token = index $existing.data $root.Values.mediamtx.cdn.key | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- range list $.Release.Namespace $ns | uniq }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ . }}
  labels:
    {{- include "qutil.labels" $root | nindent 4 }}
type: Opaque
stringData:
  {{ $root.Values.mediamtx.cdn.key }}: {{ $token | quote }}
{{- end }}
{{- end }}
