{{- if .Values.compositor.enabled }}
{{- /* The mosaic, and the audio preview that rides in the same image.

       compositeOut is a peer address: it names the media server booked beside
       this one, so it can only be filled in once both are in the same
       production namespace.

       Both publish, so both address the media server's origin Service rather
       than its read Service. The read Service fronts replicas, which proxy a
       stream rather than receive one, and a publisher landing on one would be
       writing into the instance meant to be proxying it. The origin Service is
       rendered whether or not replicas are enabled, so this needs no condition
       and resolves to the single instance where there is only one.

       flowIds is what the mosaic tiles, which is the whole point of the
       booking, so it is derived from the same writer list the claims above
       are rendered from rather than restated. */ -}}
{{- $ns := include "qutil.productionNamespace" . -}}
{{- $rtsp := printf "rtsp://%s-origin.%s:8554" .Values.mediamtx.claimName $ns -}}
{{- $flows := list -}}
{{- range .Values.writers.video -}}
{{- $flows = append $flows .flowId -}}
{{- end -}}
apiVersion: dmf.qvest-digital.com/v1alpha1
kind: MediaFunctionClaim
metadata:
  name: {{ .Values.compositor.claimName }}
  namespace: {{ $ns }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
spec:
  className: {{ .Values.compositor.className }}
  lifecycle:
    reprovisionOnDrift: {{ .Values.booking.reprovisionOnDrift }}
  booking:
    jobRef: {{ .Values.booking.jobRef | quote }}
  parameters:
    flowIds: {{ join " " $flows | quote }}
    compositeOut: {{ printf "%s/composite" $rtsp | quote }}
    frameWidth: {{ .Values.compositor.frameWidth }}
    frameHeight: {{ .Values.compositor.frameHeight }}
    {{- with .Values.compositor.parameters }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
