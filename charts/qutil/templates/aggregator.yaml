apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
data:
  aggregator.py: |
{{ .Files.Get "files/aggregator.py" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflows, mxlreceivers, mxlflowmirrors]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "qutil.fullname" . }}-aggregator
subjects:
  - kind: ServiceAccount
    name: {{ include "qutil.fullname" . }}-aggregator
    namespace: {{ .Release.Namespace }}
---
# Cluster-wide reads the per-flow panels need. MxlFlow is cluster-scoped, and
# a flow's consumers can sit in any namespace, so an all-namespaces list is
# only authorized here. Reads only: every write this app can do -- deleting a
# writer pod, creating and deleting a generator claim -- is granted in the
# production namespace by the Roles below instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator-read
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [mxl.qvest-digital.com]
    resources: [mxlflows, mxlreceivers, mxlflowmirrors]
    verbs: [get, list]
  # Per-flow origin Leases, the freshness signal behind the flow-state dot.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list]
  # Booked functions: the claim carries the endpoints this app resolves its
  # peers from, and the booking screen lists instances and their releases.
  - apiGroups: [dmf.qvest-digital.com]
    resources: [mediafunctionclaims, mediafunctions, mediafunctioninstances]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator-read
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "qutil.fullname" . }}-aggregator-read
subjects:
  - kind: ServiceAccount
    name: {{ include "qutil.fullname" . }}-aggregator
    namespace: {{ .Release.Namespace }}
---
# Pod delete in the production namespace only. The kill button demonstrates a
# writer recovering, and the writers are booked there rather than beside this
# app, so the grant follows them and reaches nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qutil.fullname" . }}-writer-kill
  namespace: {{ include "qutil.productionNamespace" . }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qutil.fullname" . }}-writer-kill
  namespace: {{ include "qutil.productionNamespace" . }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "qutil.fullname" . }}-writer-kill
subjects:
  - kind: ServiceAccount
    name: {{ include "qutil.fullname" . }}-aggregator
    namespace: {{ .Release.Namespace }}
{{- if .Values.generators.enabled }}
---
# Claim create and delete in the production namespace only, for the Generators
# page. Reads come from the ClusterRole above; this adds nothing but the two
# writes, and only where the writers are booked.
#
# RBAC cannot scope a delete to the claims this app created, so the aggregator
# stamps its own managed-by label on what it books and refuses to delete a claim
# that does not carry it. The chart's own claims carry managed-by: Helm and are
# unreachable from the page.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "qutil.fullname" . }}-generators
  namespace: {{ include "qutil.productionNamespace" . }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
rules:
  - apiGroups: [dmf.qvest-digital.com]
    resources: [mediafunctionclaims]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "qutil.fullname" . }}-generators
  namespace: {{ include "qutil.productionNamespace" . }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "qutil.fullname" . }}-generators
subjects:
  - kind: ServiceAccount
    name: {{ include "qutil.fullname" . }}-aggregator
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aggregator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "qutil.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: aggregator
  template:
    metadata:
      annotations:
        checksum/script: {{ .Files.Get "files/aggregator.py" | sha256sum }}
      labels:
        {{- include "qutil.labels" . | nindent 8 }}
        app.kubernetes.io/component: aggregator
    spec:
      serviceAccountName: {{ include "qutil.fullname" . }}-aggregator
      containers:
        - name: aggregator
          image: {{ include "qutil.aggregator.image" . }}
          imagePullPolicy: {{ .Values.aggregator.image.pullPolicy }}
          command: ["python", "/app/aggregator.py"]
          env:
            - name: GW_NS
              value: {{ .Values.aggregator.gatewayNamespace }}
            - name: FLOW_PREFIX
              value: {{ .Values.aggregator.flowPrefix | quote }}
            - name: N_FLOWS
              value: {{ .Values.aggregator.flowCount | quote }}
            - name: BOOKING_NS
              value: {{ .Values.aggregator.bookingNamespace }}
            # The booked functions live here, writers included.
            - name: PRODUCTION_NS
              value: {{ include "qutil.productionNamespace" . }}
            - name: WRITER_NS
              value: {{ include "qutil.productionNamespace" . }}
            # Peer resolution: the claim names come from values, and the class
            # names are the fallback when a claim has been renamed. The
            # addresses themselves are read from the claim's
            # status.handle.endpoints rather than assumed.
            - name: MEDIAMTX_CLAIM
              value: {{ .Values.mediamtx.claimName }}
            - name: MEDIAMTX_CLASS
              value: {{ .Values.mediamtx.className }}
            - name: COMPOSITOR_CLAIM
              value: {{ .Values.compositor.claimName }}
            - name: COMPOSITOR_CLASS
              value: {{ .Values.compositor.className }}
            - name: COMPOSITOR_STATS
              value: http://{{ .Values.compositor.claimName }}.{{ include "qutil.productionNamespace" . }}:9090/
            {{- if .Values.mcm.enabled }}
            # Only when the claim exists: /api/services reads the handle of a
            # booking this chart made, and an unset name would make it search
            # the namespace by class instead.
            - name: MCM_CLAIM
              value: {{ .Values.mcm.claimName }}
            {{- end }}
            - name: ANC_READER_CLAIM
              value: {{ .Values.ancReader.claimName }}
            - name: ANC_READER_CLASS
              value: {{ .Values.ancReader.className }}
            {{- with .Values.aggregator.ancPreviewApi }}
            # An address instead of the claim above, for a port-forwarded dev
            # loop. An install leaves it unset and resolves the booking.
            - name: ANC_PREVIEW_API
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.generators.enabled }}
            # The Generators page books writers by creating claims. Off means the
            # endpoints refuse rather than the apiserver forbidding them, so an
            # install that has not granted the Role says why.
            - name: GEN_ENABLED
              value: "true"
            - name: GEN_CLASS
              value: {{ .Values.generators.className | default .Values.writers.className }}
            - name: GEN_JOB_REF
              value: {{ .Values.generators.jobRef | quote }}
            - name: GEN_PREFIX
              value: {{ .Values.generators.namePrefix | quote }}
            # The marker a page-booked claim carries, and the only thing that
            # separates one from the claims this chart renders.
            - name: GEN_MANAGER
              value: {{ include "qutil.fullname" . }}-aggregator
            - name: GEN_MAX
              value: {{ .Values.generators.maxCount | quote }}
            # Stamped onto every page-booked claim: the class envelope is sized
            # for 1080p50, and an animated pattern needs a limit a still one
            # does not. See the generators.resources comment in values.yaml.
            - name: GEN_RESOURCES
              value: {{ toJson .Values.generators.resources | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.aggregator.service.port }}
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          # Both timeouts are the 1s default raised. /healthz is a constant and
          # is answered ahead of the in-flight gate, so missing it says the
          # process did not get scheduled rather than that it is unhealthy --
          # and restarting a busy aggregator is what turned one overload into a
          # crash loop.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.aggregator.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ include "qutil.fullname" . }}-aggregator
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qutil.fullname" . }}-aggregator
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "qutil.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: aggregator
  ports:
    - name: http
      port: {{ .Values.aggregator.service.port }}
      targetPort: http
