{{- if .Values.imagePullSecret.enabled }}
{{- /* ESO renders a GHCR PAT into a dockerconfigjson Secret so kubelet can
       pull the private UI image. The remote entry holds one JSON value with a
       username and a pat property. */ -}}
{{- if .Values.imagePullSecret.secretStore.create }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.imagePullSecret.secretStore.name }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      region: {{ .Values.imagePullSecret.secretStore.region }}
      service: SecretsManager
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "qutil.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.imagePullSecret.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.imagePullSecret.secretStore.name }}
  target:
    name: {{ .Values.imagePullSecret.name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ `{{ .username }}` }}",
                "password": "{{ `{{ .pat }}` }}",
                "auth": "{{ `{{ printf "%s:%s" .username .pat | b64enc }}` }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.imagePullSecret.remoteRef.key }}
        property: {{ .Values.imagePullSecret.remoteRef.usernameProperty }}
    - secretKey: pat
      remoteRef:
        key: {{ .Values.imagePullSecret.remoteRef.key }}
        property: {{ .Values.imagePullSecret.remoteRef.passwordProperty }}
{{- end }}
