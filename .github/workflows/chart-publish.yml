name: chart-publish

# A release-please tag publishes charts/qutil as an OCI artifact at the release
# version, and stamps that same version as the chart appVersion. The UI image
# is built at the same version by build-ui.yml on the release event, and the
# chart leaves image.tag empty, so appVersion is what resolves the image: one
# release number reaches both without either naming the other.
#
# workflow_dispatch publishes whatever the default branch's Chart.yaml declares,
# which is how a version reaches GHCR before the first release is cut.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: chart-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Resolve version
        id: parse
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(awk '/^version:/{print $2; exit}' charts/qutil/Chart.yaml)
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          set -euo pipefail
          version="${{ steps.parse.outputs.version }}"
          helm package charts/qutil \
            --version "$version" \
            --app-version "$version" \
            --destination /tmp/chart
          tgz=$(ls /tmp/chart/*.tgz)
          # github.repository rather than a literal, so a repository rename
          # moves the target instead of publishing to a name that no longer
          # matches where the chart lives.
          target="oci://ghcr.io/${{ github.repository }}/charts"
          helm push "$tgz" "$target"
          echo "Pushed $tgz to $target"
