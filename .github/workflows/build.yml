name: Push manifests

# Renders the k8s manifests and pushes them as an OCI artifact for Flux to
# reconcile. This workflow builds no image.
#
# The chart published by chart-publish.yml is the current delivery path and
# carries the same workloads. This workflow runs on manual dispatch only: the
# tag it publishes floats, a cluster reconciles that tag directly, and the
# k8s tree no longer matches the configuration such a cluster supplies. An
# automatic publish would hand a live consumer a tree it cannot run.

on:
  workflow_dispatch:
    inputs:
      pr_env:
        description: "PR env name (e.g. pr-185) -- if set, builds from 'ref' and tags as <pr_env>-latest"
        required: false
        default: ""
      ref:
        description: "Git ref to checkout -- only used when pr_env is set"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  push-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flux CLI
        shell: bash
        run: curl -s https://fluxcd.io/install.sh | sudo bash

      - name: Stage manifests
        shell: bash
        run: |
          mkdir -p /tmp/k8s-rendered
          # Copy the whole k8s/ tree (manifests + config/ subdir consumed
          # by kustomize configMapGenerator). A flat *.yaml glob would
          # silently drop config/, which then makes the kustomize build
          # in Flux fail with "no such file or directory".
          cp -R k8s/. /tmp/k8s-rendered/
          echo "=== Tree ==="
          find /tmp/k8s-rendered -type f | sort

      - name: Push k8s manifests as OCI artifact
        shell: bash
        env:
          PR_ENV: ${{ inputs.pr_env }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO="${{ env.REGISTRY }}/qvest-digital/mxl-dmf-demo-app-manifests"

          flux push artifact \
            "oci://${REPO}:${SHORT_SHA}" \
            --path="/tmp/k8s-rendered" \
            --source="$(git config --get remote.origin.url)" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"

          echo "Pushed: mxl-dmf-demo-app-manifests:${SHORT_SHA}"

          if [ -n "$PR_ENV" ]; then
            # Called by terraform PR env -- tag as <pr_env>-latest.
            flux tag artifact \
              "oci://${REPO}:${SHORT_SHA}" \
              --tag "${PR_ENV}-latest" \
              --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
            echo "Tagged: mxl-dmf-demo-app-manifests:${PR_ENV}-latest"
          else
            # The floating tag is never written here. A cluster reconciles
            # that tag directly, so moving it would hand a running deployment
            # a tree built from a different branch than the one it runs.
            echo "Skipping tag -- no pr_env set (branch: $GITHUB_REF_NAME)"
          fi
