name: Build & Push multiviewer UI image

# Builds the Angular multiviewer into a Caddy image and pushes it to GHCR under
# this repository's namespace. The chart leaves image.tag empty and resolves the
# image at the chart's appVersion, so a release publishes both at one version.

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/build-ui.yml"
  pull_request:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/build-ui.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository rather than a literal: a GHCR package does not follow a
  # repository rename, so a literal would keep publishing under the old name
  # while the chart resolves the new one.
  IMAGE: ghcr.io/${{ github.repository }}/ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run the suite outside the image build so a red test fails the job before
      # anything is published, and shows up as a test failure rather than as a
      # docker build error.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Unit tests
        working-directory: ui
        run: npx ng test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # sha tag always; version tag on a release. github.event.release.tag_name
          # is reliable on `release` events (GITHUB_REF is not). Image tags omit
          # the leading `v`, per Docker convention.
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ui
          file: ui/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version && format('{0}:{1}', env.IMAGE, steps.tags.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max
